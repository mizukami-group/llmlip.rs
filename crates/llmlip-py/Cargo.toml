[package]
name = "llmlip-py"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_llmlip"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[lints]
workspace = true

[dependencies]
llmlip.workspace = true
numpy.workspace = true
pyo3 = { workspace = true, features = ["abi3-py310", "extension-module"] }

[features]
default = []
extension-module = []
embed-model = ["llmlip/embed-model"]
baked-mace-oam-medium = ["llmlip/baked-mace-oam-medium"]
accelerate-blas = ["llmlip/accelerate-blas"]
apple-metal = ["llmlip/apple-metal"]
intel-mkl = ["llmlip/intel-mkl"]
intel-mkl-threaded = ["llmlip/intel-mkl-threaded"]
openblas = ["llmlip/openblas"]
libxsmm = ["llmlip/libxsmm"]
small-gemm-bypass = ["llmlip/small-gemm-bypass"]
orb-f32-edge-mlp = ["llmlip/orb-f32-edge-mlp"]
parallel = ["llmlip/parallel"]
